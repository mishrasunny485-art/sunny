  .time-select-wrap { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  select#timeSelect {

  .hidden { display: none !important; }

<script>

const TIMETABLE = {
  "CSAI-2B": [
    { day: 1, start: "09:00", end: "11:00", room: "515", subject: "Data Structure Lab", teacher: "Ms. Jyoti Yadav", type: "Practical" },
    { day: 1, start: "11:00", end: "12:00", room: "406", subject: "Digital Logic Design", teacher: "Mr. Ravi Shankar Yadav", type: "Lecture" },

    { day: 1, start: "16:00", end: "17:00", room: "405", subject: "Artificial Intelligence in Mechanical Engineering Systems", teacher: "Mr. Shailesh Vishwakarma", type: "Lecture" },

    { day: 3, start: "09:00", end: "11:00", room: "LGF001", subject: "Digital Logic Design Lab", teacher: "Mr. Ravi Shankar Yadav", type: "Practical" },
    { day: 3, start: "11:00", end: "12:00", room: "406", subject: "Data Structure using 'C'", teacher: "Ms. Jyoti Yadav", type: "Lecture" },
    { day: 3, start: "12:00", end: "13:00", room: "406", subject: "Artificial Intelligence in Mechanical Engineering Systems", teacher: "Mr. Shailesh Vishwakarma", type: "Lecture" },
    { day: 3, start: "14:00", end: "15:00", room: "405", subject: "Complex Analysis and Integral Transforms", teacher: "Dr. Priyanka Singh", type: "Lecture" },
    { day: 3, start: "15:00", end: "16:00", room: "405", subject: "Industrial Sociology", teacher: "Dr. Pooja Verma", type: "Lecture" },

    { day: 4, start: "09:00", end: "10:00", room: "405", subject: "Discrete Mathematics", teacher: "Ms. Shraddha Tiwari", type: "Lecture" },
    { day: 4, start: "10:00", end: "11:00", room: "405", subject: "Complex Analysis and Integral Transforms", teacher: "Dr. Priyanka Singh", type: "Lecture" },
    { day: 4, start: "11:00", end: "12:00", room: "405", subject: "Data Structure using 'C'", teacher: "Ms. Jyoti Yadav", type: "Lecture" },
    { day: 4, start: "12:00", end: "13:00", room: "Library", subject: "Library", teacher: "-", type: "Library" },
    { day: 4, start: "14:00", end: "15:00", room: "405", subject: "Artificial Intelligence in Mechanical Engineering Systems", teacher: "Mr. Shailesh Vishwakarma", type: "Lecture" },
    { day: 4, start: "15:00", end: "16:00", room: "405", subject: "Industrial Sociology", teacher: "Dr. Pooja Verma", type: "Lecture" },
    { day: 4, start: "16:00", end: "17:00", room: "407", subject: "Digital Logic Design", teacher: "Mr. Ravi Shankar Yadav", type: "Lecture" },

    { day: 5, start: "09:00", end: "10:00", room: "407", subject: "Data Structure using 'C'", teacher: "Ms. Jyoti Yadav", type: "Lecture" },
    { day: 5, start: "10:00", end: "11:00", room: "407", subject: "Artificial Intelligence in Mechanical Engineering Systems", teacher: "Mr. Shailesh Vishwakarma", type: "Lecture" },
    { day: 5, start: "11:00", end: "13:00", room: "CH", subject: "NSS / Yoga", teacher: "Ms. Veena Dwivedi", type: "Practical" },
    { day: 5, start: "14:00", end: "15:00", room: "406", subject: "Discrete Mathematics", teacher: "Ms. Shraddha Tiwari", type: "Lecture" },
    { day: 5, start: "15:00", end: "16:00", room: "405", subject: "Digital Logic Design", teacher: "Mr. Ravi Shankar Yadav", type: "Lecture" },
    { day: 5, start: "16:00", end: "17:00", room: "403", subject: "Complex Analysis and Integral Transforms", teacher: "Dr. Priyanka Singh", type: "Lecture" },
  ]
};

const COLOR_CYCLE = ["#FF4E88", "#FFD93D", "#6BCB77", "#4D96FF", "#C86DFC", "#FF9F43"];
const DAY_LABELS = { 1: "Monday", 2: "Tuesday", 3: "Wednesday", 4: "Thursday", 5: "Friday" };
const DAY_SHORT = { 1: "Mon", 2: "Tue", 3: "Wed", 4: "Thu", 5: "Fri" };

// Time slots now 1-hour gaps: 09:00, 10:00 ... 17:00
const TIME_SLOTS = [];
for (let h = 9; h <= 17; h++) {
  TIME_SLOTS.push(`${h.toString().padStart(2,"0")}:00`);
}

let currentStudent = null;
let selectedDay = new Date().getDay();

function toMinutes(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}

function deriveFloor(room) {
  if (room === "Library") return "LIBRARY";
  if (room.startsWith("LGF")) return "LOWER GROUND";
  if (room === "CH") return "CENTRAL HALL";
  const firstDigit = room.charAt(0);
  const map = { "1": "1ST FLOOR", "2": "2ND FLOOR", "3": "3RD FLOOR", "4": "4TH FLOOR", "5": "5TH FLOOR" };
  return map[firstDigit] || (firstDigit + " FLOOR");
}

function colorFor(i) { return COLOR_CYCLE[i % COLOR_CYCLE.length]; }

function closestSlot(h, m) {
  const mins = h * 60 + m;
  let best = TIME_SLOTS[0];
  let bestDiff = Infinity;
  TIME_SLOTS.forEach(t => {
    const diff = Math.abs(toMinutes(t) - mins);
    if (diff < bestDiff) { bestDiff = diff; best = t; }
  });
  return best;
}

function currentFacultyNow(section) {
  const now = new Date();
  const day = now.getDay();
  const mins = now.getHours() * 60 + now.getMinutes();
  const periods = TIMETABLE[section] || [];
  const p = periods.find(p => p.day === day && mins >= toMinutes(p.start) && mins < toMinutes(p.end));
  return p ? p.teacher : "No class right now";
}

function handleSearch() {
  const name = document.getElementById("nameInput").value.trim();
  const mobile = document.getElementById("mobileInput").value.trim();
  const errorBox = document.getElementById("errorBox");

  const student = STUDENTS.find(
    s => s.name.trim().toLowerCase() === name.toLowerCase() && s.mobile.trim() === mobile
  );

  if (!student) {
    errorBox.innerHTML = `<div class="error-box">❌ No match found. Check the name and mobile number and try again.</div>`;
    document.getElementById("resultSection").classList.add("hidden");
    return;
  }

  errorBox.innerHTML = "";
  currentStudent = student;
  selectedDay = new Date().getDay();
  if (selectedDay === 0 || selectedDay === 6) selectedDay = 1;

  document.getElementById("searchSection").classList.add("hidden");
  document.getElementById("resultSection").classList.remove("hidden");

  renderDetailsCard();
  renderPicker();
  renderView();
}

function backToSearch() {
  document.getElementById("searchSection").classList.remove("hidden");
  document.getElementById("resultSection").classList.add("hidden");
  document.getElementById("nameInput").value = "";
  document.getElementById("mobileInput").value = "";
  currentStudent = null;
}

function renderDetailsCard() {
  const s = currentStudent;
  document.getElementById("detailsCardWrap").innerHTML = `
    <div class="details-card">
      <div class="details-topline">
        <div class="details-greet">👋 Hi ${s.name}!</div>
        <button class="change-btn" onclick="backToSearch()">🔄 Change</button>
      </div>
      <div class="details-grid">
        <div class="detail-chip"><div class="label">Name</div><div class="value">${s.name}</div></div>
        <div class="detail-chip"><div class="label">Mobile</div><div class="value">${s.mobile}</div></div>
        <div class="detail-chip"><div class="label">Section</div><div class="value">${s.section}</div></div>
        <div class="detail-chip"><div class="label">Faculty Now</div><div class="value">${currentFacultyNow(s.section)}</div></div>
        <div class="detail-chip"><div class="label">Coordinator</div><div class="value">Ms. Jyoti Yadav</div></div>
        <div class="detail-chip"><div class="label">Coordinator No.</div><div class="value">9793793897</div></div>
      </div>
    </div>
  `;

}

function renderPicker() {
  const now = new Date();
  const currentSlot = closestSlot(now.getHours(), now.getMinutes());

  let dayHtml = "";
  for (let d = 1; d <= 5; d++) {
    dayHtml += `<div class="day-pill ${d === selectedDay ? 'active' : ''}" onclick="selectDay(${d})">${DAY_SHORT[d]}</div>`;
  }

  let timeOptions = TIME_SLOTS.map(t => `<option value="${t}" ${t === currentSlot ? 'selected' : ''}>${t}</option>`).join("");

  document.getElementById("pickerWrap").innerHTML = `
    <div class="picker-card">
      <div class="picker-label">📅 Pick a day</div>
      <div class="day-pills">${dayHtml}</div>
      <div class="picker-label">⏰ Pick a time</div>
      <div class="time-select-wrap">
        <select id="timeSelect" onchange="renderView()">${timeOptions}</select>
        <button class="now-btn" onclick="resetToNow()">📍 Right Now</button>
      </div>
    </div>
  `;
}

function selectDay(d) {
  selectedDay = d;
  renderPicker();
  renderView();
}

function resetToNow() {
  const now = new Date();
  let todayIdx = now.getDay();
  if (todayIdx === 0 || todayIdx === 6) todayIdx = 1;
  selectedDay = todayIdx;
  renderPicker();
  document.getElementById("timeSelect").value = closestSlot(now.getHours(), now.getMinutes());
  renderView();
}

function renderView() {
  const student = currentStudent;
  if (!student) return;

  const timeVal = document.getElementById("timeSelect").value;
  const mins = toMinutes(timeVal);

  const now = new Date();
  const todayIdx = now.getDay();
  const isToday = selectedDay === todayIdx;
  const isRealNow = isToday && Math.abs(mins - (now.getHours()*60+now.getMinutes())) < 35;

  const periods = (TIMETABLE[student.section] || [])
    .filter(p => p.day === selectedDay)
    .sort((a,b) => toMinutes(a.start) - toMinutes(b.start));
  const current = periods.find(p => mins >= toMinutes(p.start) && mins < toMinutes(p.end));

  const popupWrap = document.getElementById("popupWrap");
  popupWrap.innerHTML = `<div class="popup-header">${DAY_LABELS[selectedDay]} · ${timeVal} · Section ${student.section}</div>`;

  if (current) {
    const idx = periods.indexOf(current);
    const color = colorFor(idx);
    popupWrap.innerHTML += `
     <div class="popup" style="background: linear-gradient(135deg, ${color}, #1a1440);">
        <div class="popup-tag ${isRealNow ? 'pulse' : ''}">${isRealNow ? '🔴 HAPPENING NOW' : '📌 CLASS AT THIS TIME'}</div>
        <div class="popup-subject">${current.subject}</div>
        <div class="big-stats">
          <div class="big-stat">
            <div class="label">Floor</div>
            <div class="value">${deriveFloor(current.room)}</div>
          </div>
          <div class="big-stat">
            <div class="label">Room No.</div>
            <div class="value">${current.room}</div>
          </div>
        </div>
        <div class="popup-mini">
          <span>👤 ${current.teacher}</span>
          <span>⏰ ${current.start} – ${current.end}</span>
        </div>
      </div>`;
  } else {
    popupWrap.innerHTML += `<div class="free-popup">🎉 No class at this time for ${student.section}. Free period!</div>`;
  }

  const scheduleWrap = document.getElementById("scheduleWrap");
  let html = `<div class="schedule-title">🗓️ ${DAY_LABELS[selectedDay]}'s schedule — ${student.section}</div>`;
  if (periods.length === 0) {
    html += `<div class="empty-day">No classes scheduled on ${DAY_LABELS[selectedDay]}. 🎊</div>`;
  } else {
    periods.forEach((p, i) => {
      const color = colorFor(i);
      const isNow = p === current;
      html += `
        <div class="schedule-card ${isNow ? 'now' : ''}" style="--accent:${color}; border-color:${color}55; background:${color}18;">
          <div class="room-badge">
            <div class="room-num">${p.room}</div>
            <div class="floor-txt">${deriveFloor(p.room)}</div>
          </div>
          <div class="schedule-body">
            <div class="schedule-subject">${p.subject} ${isNow ? '<span class="now-badge">NOW</span>' : ''}</div>
            <div class="schedule-meta">
              <span>👤 ${p.teacher}</span>
            </div>
            <div class="schedule-time">⏰ ${p.start} – ${p.end}</div>
          </div>
        </div>`;
    });
  }
  scheduleWrap.innerHTML = html;
}
</script>
</body>
</html>
